plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
	// Simple Voice Chat plugin API (compile only; players install SVC themselves).
	maven {
		url = 'https://maven.maxhenkel.de/repository/public'
		mavenContent { releasesOnly() }
		content { includeGroup 'de.maxhenkel.voicechat' }
	}
	// Simple Voice Chat mod jar for dev runs only (runServer/runClient), never bundled.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

configurations {
	// SVC is All Rights Reserved: it lives only on the dev run classpath, not in the jar or the gametest run.
	voicechatDevRuntime {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"guardvillagers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "guardvillagers-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// Opt-in server benchmark (src/gametest/.../perf). Off unless -Pperf is passed:
//   ./gradlew runGameTest -Pperf                       all scenarios, results in build/perf/
//   -PperfOnly=combat_128,follow_64                    run only scenarios with these name prefixes
//   -PperfSizes=16,64,128 -PperfMeasure=600 -PperfWarmup=100 -PperfJitWarmup=200
//   -PperfJfr                                          also record build/perf/guard-perf.jfr
if (project.hasProperty('perf')) {
	tasks.matching { it.name == 'runGameTest' }.configureEach {
		def outDir = file('build/perf')
		doFirst { outDir.mkdirs() }
		systemProperty 'guardvillagers.perf', 'true'
		systemProperty 'guardvillagers.perf.out', outDir.absolutePath
		systemProperty 'fabric-api.gametest.filter', 'guardvillagers-gametest:guard_perf_benchmark*'
		[perfOnly: 'only', perfSizes: 'sizes', perfMeasure: 'measure', perfWarmup: 'warmup', perfJitWarmup: 'jitwarmup'].each { prop, key ->
			if (project.hasProperty(prop)) {
				systemProperty "guardvillagers.perf.${key}", project.property(prop).toString()
			}
		}
		if (project.hasProperty('perfJfr')) {
			jvmArgs "-XX:StartFlightRecording=filename=${outDir.absolutePath}/guard-perf.jfr,settings=profile,dumponexit=true"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	testImplementation platform("org.junit:junit-bom:5.14.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Optional Simple Voice Chat integration (com.guardvillagers.compat.voicechat only).
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.20"
	testImplementation "de.maxhenkel.voicechat:voicechat-api:2.6.20"
	// voicechat-fabric 2.6.21+26.1.2 (Modrinth project 9eGKb6K1, version BvX8YEGO).
	voicechatDevRuntime "maven.modrinth:9eGKb6K1:BvX8YEGO"

}

test {
	useJUnitPlatform()
}

tasks.matching { it.name == 'runServer' || it.name == 'runClient' }.configureEach {
	classpath(configurations.voicechatDevRuntime)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
